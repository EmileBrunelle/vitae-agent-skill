[tool.ruff]
target-version = "py311"
# Longest code lines are ~250 chars; E501 is ignored below, so this only documents intent.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ANN401"]  # ANN401: no explicit Any; a third-party boundary that needs one carries `# noqa: ANN401` and a reason
ignore = [
    "E501",  # long lines: no reformatting of the codebase (code lines reach ~250 chars)
    "E702",  # several statements on one line with ';' is this repo's style
    "E731",  # assigned lambdas are kept for short local helpers
    "E741",  # ambiguous l/O/I names: renaming them across the verify.py + verify_*.py modules is risky for little gain
    "B007",  # unused loop variable: kept for readable tuple unpacking
    "B905",  # zip() without strict=: adding it would change behaviour on unequal lengths
]
