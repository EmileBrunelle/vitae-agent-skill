# Optional runtime dependency, not required (PEP 735 group: this repo is a skill, not a package, so it has no [project] table).
# `uv run scripts/verify.py` installs it from the scripts' PEP 723 blocks; elsewhere `pip install "pikepdf>=10.8.0"`, or `pip install --group pdf` (pip 25.1+) for dev venvs. 10.8.0 is what Fedora ships (python3-pikepdf); the
# post-step in scripts/vitae/verify/hexstrings.py was run on that version.
[dependency-groups]
pdf = ["pikepdf>=10.8.0"]
# Test-only: the property tests (tests/unit/test_*_complexity.py) compare the rewritten scanners with the code they replaced, on
# generated inputs and worst cases. CI installs the same pin on its `pip install` lines; `pip install --group test` (pip 25.1+) for dev venvs.
test = ["hypothesis==6.170.17"]

[tool.ruff]
target-version = "py311"
# Longest code lines are ~250 chars; E501 is ignored below, so this only documents intent.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ANN401", "C901", "PLR0915", "PLR0913", "PLW", "SIM115", "BLE001", "RUF012", "RUF100", "RUF059", "PT011", "RET", "PIE", "C4", "PERF", "FURB", "RUF", "UP031", "UP032"]  # UP031/UP032: no printf-style % formatting (f-strings keep the output visible in the source). ANN401: no explicit Any; a third-party boundary that needs one carries `# noqa: ANN401` and a reason. C901/PLR0915/PLR0913: function complexity, length and argument-count caps (see [tool.ruff.lint.mccabe] and per-file-ignores)
ignore = [
    "E501",  # long lines: no reformatting of the codebase (code lines reach ~250 chars)
    "E702",  # several statements on one line with ';' is this repo's style
    "E731",  # assigned lambdas are kept for short local helpers
    "E741",  # ambiguous l/O/I names: renaming them across the verify.py + verify_*.py modules is risky for little gain
    "B007",  # unused loop variable: kept for readable tuple unpacking
    "RUF001",  # ambiguous unicode in strings: the repo carries intentional non-ASCII text
    "RUF003",  # same, in comments
    "B905",  # zip() without strict=: adding it would change behaviour on unequal lengths
]

[tool.ruff.lint.mccabe]
max-complexity = 11     # what verify/groups/ passes; the ruff default of 10 flags two of its functions at 11

[tool.ruff.lint.pylint]
max-statements = 50     # ruff default

[tool.ruff.lint.per-file-ignores]
# Modules written before C901/PLR0915/PLR0913 were enabled: listed explicitly, not refactored here.
# A new long, branchy or many-argument function in any other file fails the lint; shrink an entry's function, then drop its line.
"scripts/vitae/design/cli.py" = ["C901", "PLR0915"]
"scripts/vitae/design/init.py" = ["C901", "PLR0915", "PLR0913"]
"scripts/vitae/design/pick.py" = ["C901"]
"scripts/vitae/icons.py" = ["C901", "PLR0915"]
"scripts/vitae/palette.py" = ["C901"]
"scripts/vitae/verify/academic/checks.py" = ["C901", "PLR0915", "PLR0913"]
"scripts/vitae/verify/academic/cli.py" = ["C901"]
"scripts/vitae/verify/cli.py" = ["C901", "PLR0915"]
"scripts/vitae/verify/cv.py" = ["C901", "PLR0915"]
"scripts/vitae/verify/fonts.py" = ["C901"]
"scripts/vitae/verify/gates.py" = ["PLR0913"]
"scripts/vitae/verify/groups/dates.py" = ["PLR0913"]
"scripts/vitae/verify/groups/ink.py" = ["PLR0913"]
"scripts/vitae/verify/groups/proximity.py" = ["PLR0913"]
"scripts/vitae/verify/jsonout.py" = ["C901"]
"scripts/vitae/verify/layout.py" = ["C901"]
"scripts/vitae/verify/page.py" = ["C901", "PLR0915"]
"scripts/vitae/verify/pdf.py" = ["C901", "PLR0913"]
"scripts/vitae/verify/review_record.py" = ["C901", "PLR0915"]
"scripts/vitae/verify/text.py" = ["C901", "PLR0913"]
"scripts/vitae/verify/tune.py" = ["C901", "PLR0915", "PLR0913"]
"scripts/vitae/verify/typst.py" = ["C901"]
"tests/**" = ["PLR0913"]   # pytest fixtures count as arguments; reference implementations mirror the old signatures
"tests/backend_equiv.py" = ["C901", "PLR0915"]
"tests/unit/_typst_ref.py" = ["C901"]   # the replaced mask_non_markup, verbatim (oracle)

[tool.pyright]
# Mirrors mypy.ini: the minimum supported Python (CI tests 3.11), and scripts/ on the import path the way tests/conftest.py puts it there, so `vitae` and the façades resolve in editors and the CLI.
pythonVersion = "3.11"
include = ["scripts", "tests"]
typeCheckingMode = "strict"
extraPaths = ["scripts"]
# Tests are not annotated (mypy.ini checks scripts/ only): strict stays on for real type errors, but the rules that only flag missing annotations or intended access to module internals are off under tests/, and so is reportMissingTypeStubs (pypdfium2 ships no stubs; scripts/ reaches it through the typed vitae.core.pdfium wrapper).
executionEnvironments = [
    { root = "tests", extraPaths = ["scripts"], reportMissingParameterType = false, reportUnknownParameterType = false, reportUnknownArgumentType = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownLambdaType = false, reportPrivateUsage = false, reportMissingTypeStubs = false },
    { root = "scripts" },
]

[tool.pytest.ini_options]
# Unmarked tests are pure unit tests. `pytest tests/unit` runs everything; `-m "not integration and not lint"` is the fast loop.
addopts = "--strict-markers"
markers = [
    "integration: spawns subprocesses, uses external binaries or real sockets",
    "lint: repo ratchet over the checked-in files (SKILL.md, Markdown, references), not over code behaviour",
    "slow: bounds the wall time of a worst-case input (complexity regression), still seconds at most",
]

# Local mutation testing (not run in CI): `tests/mutmut.sh run`, see CONTRIBUTING.md.
[tool.mutmut]
source_paths = ["src/vitae/verify/review_record.py", "src/vitae/verify/jsonout.py", "src/vitae/verify/registry.py", "src/vitae/verify/cv.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_verify_review_record.py", "tests/unit/test_verify_json.py", "tests/unit/test_verify_jsonout.py", "tests/unit/test_verify_placeholders.py", "tests/unit/test_leading_family_ratio.py", "tests/unit/test_verify_help_cli.py", "tests/unit/test_verify_cv_files.py", "tests/unit/test_verify_locale.py"]
also_copy = ["src/", "scripts/", "SKILL.md", "templates/", "references/", "tests/unit/"]
max_stack_depth = 8
