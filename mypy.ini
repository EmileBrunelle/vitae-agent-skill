[mypy]
python_version = 3.11
files = scripts/, tests/integration
# the integration tests import `harness` by bare name (pytest prepends their folder) and the scripts by package name
mypy_path = scripts:tests/integration
explicit_package_bases = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
strict = True
