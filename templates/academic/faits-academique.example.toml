# vitae-academic data file — SCHEMA (read this before writing a gate or a
# real dossier against it). All data below is FICTIONAL (example only).
#
# WHY THIS FILE, NOT THE .typ, IS THE SOURCE OF TRUTH FOR COUNTS/ORDER:
# the gate checks `N_declared == N_extracted` per section (check A) and
# strict antechronology per section (check B) by reading the counts and
# undated-prefix lengths declared HERE against `pdftotext -layout` of the
# rendered PDF — never against the .typ, which would be a tautology (a
# regex on the source compared to a PDF compiled from that same source).
#
# GENERAL CONVENTIONS
# - Every entry table carries `date` and `src`. `src` is the same
#   provenance-per-fact convention as FAITS.md (e.g. "faits.md#pub-3"): a
#   fabricated entry with no traceable source is a research-conduct problem
#   in this genre, not mere embellishment (design note §4.1).
# - `date` is normally a 4-digit year (string, e.g. "2022") or a range
#   ("2019-2024"). For an UNDATED-PREFIX entry (submitted/forthcoming items
#   that precede the dated sequence in publications/talks), `date` is a
#   status string instead ("submitted", "forthcoming", "in press") — never
#   guessed, always declared, and counted by the matching `undated_prefix`
#   entry in `[counts]` below.
# - Sections are declared even when empty/optional: an optional section with
#   zero entries still gets `count = 0` so the gate can tell "empty" from
#   "not implemented".
#
# [counts] — the declared entry count per section, checked against
# `pdftotext` extraction by EQUALITY (check A). Flat sections use one key;
# split sections (publications, talks) use a nested table, one key per
# sub-type. This is the ONLY table the gate needs to know how many rows to
# expect — it never counts `[[array.of.tables]]` occurrences itself, because
# a section can legitimately declare 0 while carrying no array at all.
#
#   counts.education, counts.appointments, counts.honours,
#   counts.publications.{journal,conference,chapter,preprint,other},
#   counts.talks.{plenary,invited,conference,seminar,poster},
#   counts.funding, counts.supervision, counts.teaching, counts.service,
#   counts.knowledge_mobilization, counts.references
#
# [undated_prefix] — declared length of the undated lead-in (submitted /
# forthcoming / in press) for sections where that convention applies
# (publications and talks sub-types only; 0 = no prefix, the default for
# every other section since they have no such convention). Check B skips
# exactly this many leading rows before requiring non-increasing years.
#
# PER-SECTION REQUIRED FIELDS (beyond date/src):
#   [meta]          name, title, affiliation, address, email, cv_date
#                   (required — "CV version date"), lang. Optional:
#                   website, orcid.
#   [[education]]   degree, institution. Optional: thesis, supervisor.
#   [[appointments]] role, institution. Optional: kind (postdoc/visiting/
#                   sabbatical/regular).
#   [[honours]]     title, awarding_body. (optional section)
#   [[publications.<type>]]  authors, title, venue. Optional: doi, status.
#                   <type> in journal | conference | chapter | preprint | other.
#                   Conference here means PEER-REVIEWED PROCEEDINGS treated
#                   as a primary publication (math/CS convention, design
#                   note §2) — do not confuse with [[talks.conference]].
#   [[talks.<tier>]]  title, event, location.
#                   <tier> in plenary | invited | conference | seminar | poster,
#                   listed in that descending-prestige order in the CV.
#   [[funding]]     agency, program, role (PI or co-I), amount, currency,
#                   period.
#   [[supervision]] student, level (PhD/MSc/postdoc/intern), thesis_title.
#                   Optional: current_position, end_date.
#   [[teaching]]    code, title, level, term, enrolment.
#   [[service]]     category (referee/committee/jury/editorial/organizing/
#                   society), description (name the journal/body — a
#                   referee entry with no named journal does not satisfy
#                   section 10 of the design note).
#   [[knowledge_mobilization]]  description. (optional section)
#   [[references]]  name, affiliation, email. (optional section, US convention)
# affiliations_languages is TWO PLAIN LINES, not a dated list — no `count`,
# no antechronology check applies to it.

