name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = declared minimum (tomllib); 3.x = latest stable.
        python-version: ["3.11", "3.x"]
    timeout-minutes: 20
    env:
      TYPST_VERSION: "0.15.1"
      # google/fonts and GNOME/adwaita-fonts, pinned so a font update cannot
      # silently move the fill targets.
      GOOGLE_FONTS_SHA: 6157dfaa640ca5738b4d1a7070fe389c3036d7fc
      ADWAITA_FONTS_SHA: 0c79765f2bef25b38902fd8497616ac28185254c  # tag 51.0
      STIX_SHA: 744a22a4dd626cd14d75728aef34fc8ad7c85db0  # stipub/stixfonts v2.13b171
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Python dependencies
        run: pip install Pillow pypdf mypy

      - name: Typst ${{ env.TYPST_VERSION }}
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP" typst-x86_64-unknown-linux-musl/typst
          sudo install -m 0755 "$RUNNER_TEMP/typst" /usr/local/bin/typst
          typst --version

      # Distro-packaged faces (references/fonts.md, "Prefer the distro package").
      # Not packaged on Ubuntu 24.04: Libertinus Serif (embedded in Typst),
      # Fira, PT Sans (Ubuntu's is the older PTF build), STIX Two Text (Ubuntu's
      # fonts-stix is STIX 1) and Source Code Pro; those come from pinned
      # downloads below, the same files as the maintainer's Fedora packages.
      - name: Fonts from apt, plus poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fontconfig \
            fonts-liberation fonts-noto-core fonts-open-sans fonts-urw-base35 \
            fonts-crosextra-caladea fonts-cantarell \
            fonts-vazirmatn fonts-dejavu-core

      # Google-Fonts-only faces and Adwaita (no Ubuntu package): Route 1 of
      # references/fonts.md, from pinned commits. Cached by those pins.
      - name: Restore downloaded fonts
        id: fonts-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/fonts/vitae
          key: fonts-${{ env.GOOGLE_FONTS_SHA }}-${{ env.ADWAITA_FONTS_SHA }}

      - name: Download Google Fonts + Adwaita
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          dest="$HOME/.local/share/fonts/vitae"; mkdir -p "$dest"
          git init -q "$RUNNER_TEMP/gf"; cd "$RUNNER_TEMP/gf"
          git remote add origin https://github.com/google/fonts
          git config core.sparseCheckout true
          printf 'ofl/%s\n' firasans firamono ptsans geist geistmono onest instrumentsans publicsans \
            schibstedgrotesk spacegrotesk hankengrotesk familjengrotesk chivo \
            bigshouldersdisplay redhatdisplay redhattext redhatmono \
            > .git/info/sparse-checkout
          git fetch -q --depth 1 origin "$GOOGLE_FONTS_SHA"
          git checkout -q FETCH_HEAD
          find ofl -name '*.ttf' -exec cp {} "$dest"/ \;
          git init -q "$RUNNER_TEMP/ad"; cd "$RUNNER_TEMP/ad"
          git remote add origin https://github.com/GNOME/adwaita-fonts
          git fetch -q --depth 1 origin "$ADWAITA_FONTS_SHA"
          git checkout -q FETCH_HEAD
          find sans mono -name '*.ttf' -exec cp {} "$dest"/ \;
          for w in Regular Italic Medium MediumItalic SemiBold SemiBoldItalic Bold BoldItalic; do
            curl -fsSL -o "$dest/STIXTwoText-$w.otf" \
              "https://raw.githubusercontent.com/stipub/stixfonts/$STIX_SHA/fonts/static_otf/STIXTwoText-$w.otf"
          done
          curl -fsSL -o "$RUNNER_TEMP/scp.zip" \
            "https://github.com/adobe-fonts/source-code-pro/releases/download/2.042R-u/1.062R-i/1.026R-vf/OTF-source-code-pro-2.042R-u_1.062R-i.zip"
          unzip -q -j "$RUNNER_TEMP/scp.zip" 'OTF/*.otf' -d "$dest"

      - name: Check every font the templates name is visible to Typst
        run: |
          fc-cache -f
          typst fonts > "$RUNNER_TEMP/fonts.txt"
          missing=0
          while IFS= read -r fam; do
            grep -Fxq "$fam" "$RUNNER_TEMP/fonts.txt" || { echo "missing font: $fam"; missing=1; }
          done <<'LIST'
          Adwaita Mono
          Adwaita Sans
          Big Shoulders Display
          C059
          Caladea
          Cantarell
          Chivo
          DejaVu Sans Mono
          Familjen Grotesk
          Fira Mono
          Fira Sans
          Geist
          Geist Mono
          Hanken Grotesk
          Instrument Sans
          Liberation Sans
          Libertinus Serif
          Nimbus Sans
          Noto Sans
          Noto Sans Mono
          Noto Serif
          Onest
          Open Sans
          P052
          PT Sans
          Public Sans
          Red Hat Display
          Red Hat Mono
          Red Hat Text
          Schibsted Grotesk
          Source Code Pro
          Space Grotesk
          STIX Two Text
          Vazirmatn
          LIST
          exit $missing

      - name: Type check (mypy.ini)
        run: python -m mypy

      - name: Run all checks
        run: tests/run_all.sh "$RUNNER_TEMP/out"

      - name: Upload template PDFs and PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: templates-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/out/pdf
            ${{ runner.temp }}/out/log
          if-no-files-found: warn
