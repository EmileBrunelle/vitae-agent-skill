name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = declared minimum (tomllib); 3.x = latest stable.
        # 3.11 runs the Python-version-sensitive checks (mypy, ruff, tests/unit) plus the backend verdict
        # equivalence bench; 3.x runs the template compiles (integration suite). Typst, poppler and fonts are
        # installed on both legs (the bench needs them); the integration suite is identical across Python
        # versions, so it runs on 3.x only. The two long steps sit on different legs to shorten the critical path.
        python-version: ["3.11", "3.x"]
        # pikepdf only on 3.x: it enables the hexstrings tests (smalot #860) that otherwise skip.
        # Without pikepdf run: tests/unit and the equivalence bench on 3.11, and the pure-python job (unit +
        # integration through typst-py, no CLI). The CLI integration suite runs on 3.x only, so always with
        # pikepdf. The value carries its own single quotes so bash does not read ">=" as a redirection.
        include:
          - python-version: "3.x"
            pip-extra: "'pikepdf>=10.8.0'"
    timeout-minutes: 20
    env:
      TYPST_VERSION: "0.15.1"
      # typst-py 0.15.2 embeds Typst 0.15.1 (the CLI above); the PyPI wheel is pinned on its own.
      TYPST_PY_VERSION: "0.15.2"
    steps:
      - uses: actions/checkout@v7

      - name: No symlinks in the tree
        # claude.ai rejects zips containing symlinks; Windows checkouts without symlink support break them.
        run: |
          links="$(find . -type l -not -path './.git/*')"
          if [ -n "$links" ]; then echo "symlinks are not allowed:"; echo "$links"; exit 1; fi

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Python dependencies
        # typst + pypdfium2 are what the integration suite's backend comparison and the equivalence bench
        # need next to the CLI/poppler; typst-py is pinned to its own PyPI version.
        run: pip install Pillow pypdf pyyaml==6.0.4 mypy==2.4.1 ruff==0.17.6 pytest==9.2.0 pytest-xdist==3.8.0 hypothesis==6.170.17 pypdfium2 "typst==$TYPST_PY_VERSION" ${{ matrix.pip-extra }}

      - name: Typst ${{ env.TYPST_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        # gh goes through the API asset endpoint; the plain releases/download URL
        # returned 504 for hours on 2026-11-08 while the API kept serving.
        run: |
          gh release download "v${TYPST_VERSION}" -R typst/typst \
            -p typst-x86_64-unknown-linux-musl.tar.xz -O - \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP" typst-x86_64-unknown-linux-musl/typst
          sudo install -m 0755 "$RUNNER_TEMP/typst" /usr/local/bin/typst
          typst --version

      - name: poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      # Fonts: .github/actions/fonts (shared with the pure-python job).
      - uses: ./.github/actions/fonts

      - name: Check every font the templates name is visible to Typst
        run: |
          typst fonts > "$RUNNER_TEMP/fonts.txt"
          missing=0
          while IFS= read -r fam; do
            grep -Fxq "$fam" "$RUNNER_TEMP/fonts.txt" || { echo "missing font: $fam"; missing=1; }
          done < .github/actions/fonts/families.txt
          exit $missing

      - name: Type check (mypy.ini, strict)
        run: python -m mypy

      - name: Type check (pyproject.toml, pyright strict)
        # One leg is enough: pyright reads pythonVersion from pyproject.toml, and only 3.x has pikepdf installed.
        # numpy is only there so Pillow's types resolve (its `Image.point` signature names numpy arrays).
        if: matrix.python-version == '3.x'
        run: |
          pip install pyright==1.1.414 numpy typing_extensions
          pyright

      - name: Lint (pyproject.toml)
        run: ruff check scripts tests evals

      - name: Unit tests (tests/unit)
        run: python -m pytest -q -rs -n auto tests/unit

      - name: Integration checks (tests/integration)
        if: matrix.python-version == '3.x'
        run: python -m pytest -q -rs -n auto tests/integration --vitae-out "$RUNNER_TEMP/out"

      # Same inputs through poppler vs pypdfium2 and typst CLI vs typst-py: gate VERDICTS must match
      # (the bench needs the CLI and poppler, so it lives in this job, not in pure-python). Runs on the
      # 3.11 leg, which has the shorter path, while 3.x runs the integration suite.
      - name: Backend verdict equivalence
        if: matrix.python-version == '3.11'
        run: python tests/backend_equiv.py "$RUNNER_TEMP/equiv"

      - name: Upload template PDFs and PNGs
        if: always() && matrix.python-version == '3.x'
        uses: actions/upload-artifact@v7
        with:
          name: templates-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/out/pdf
            ${{ runner.temp }}/out/log
          if-no-files-found: warn

  # No apt poppler, no Typst CLI: everything goes through typst-py and pypdfium2, the path a
  # user with `pip install` only gets. Fonts are the same as the full job, so fill targets hold.
  pure-python:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      TYPST_PY_VERSION: "0.15.2"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Python dependencies (no poppler, no typst CLI)
        run: pip install "typst==$TYPST_PY_VERSION" pypdfium2 Pillow pypdf

      - name: Lint (pyproject.toml)
        run: |
          pip install ruff==0.17.6 pytest==9.2.0 pytest-xdist==3.8.0 hypothesis==6.170.17 pyyaml==6.0.4
          ruff check scripts tests evals
          python -m pytest -q -rs -n auto tests/unit

      - uses: ./.github/actions/fonts

      - name: Check every font the templates name is visible to typst-py
        run: |
          python - <<'PY'
          import sys, typst
          have = set(typst.Fonts(include_system_fonts=True).families())
          want = [l.strip() for l in open(".github/actions/fonts/families.txt") if l.strip()]
          missing = [f for f in want if f not in have]
          for f in missing: print("missing font:", f)
          sys.exit(1 if missing else 0)
          PY

      - name: Confirm no CLI tools are on PATH
        run: |
          for t in typst pdftotext pdfinfo pdftoppm; do ! command -v "$t" || { echo "$t is installed"; exit 1; }; done

      - name: Integration checks (tests/integration)
        run: python -m pytest -q -rs -n auto tests/integration --vitae-out "$RUNNER_TEMP/out"
