name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = declared minimum (tomllib); 3.x = latest stable.
        python-version: ["3.11", "3.x"]
    timeout-minutes: 20
    env:
      TYPST_VERSION: "0.15.1"
      # typst-py (PyPI) trails the CLI: 0.15.1 does not exist there, 0.15.0 is the newest.
      TYPST_PY_VERSION: "0.15.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Python dependencies
        # typst + pypdfium2 are what run_all's compare_backends step and the equivalence bench
        # need next to the CLI/poppler; typst-py is pinned to its own PyPI version.
        run: pip install Pillow pypdf mypy pypdfium2 "typst==$TYPST_PY_VERSION"

      - name: Typst ${{ env.TYPST_VERSION }}
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP" typst-x86_64-unknown-linux-musl/typst
          sudo install -m 0755 "$RUNNER_TEMP/typst" /usr/local/bin/typst
          typst --version

      - name: poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      # Fonts: .github/actions/fonts (shared with the pure-python job).
      - uses: ./.github/actions/fonts

      - name: Check every font the templates name is visible to Typst
        run: |
          typst fonts > "$RUNNER_TEMP/fonts.txt"
          missing=0
          while IFS= read -r fam; do
            grep -Fxq "$fam" "$RUNNER_TEMP/fonts.txt" || { echo "missing font: $fam"; missing=1; }
          done < .github/actions/fonts/families.txt
          exit $missing

      - name: Type check (mypy.ini)
        run: python -m mypy

      - name: Run all checks
        run: tests/run_all.sh "$RUNNER_TEMP/out"

      # Same inputs through poppler vs pypdfium2 and typst CLI vs typst-py: gate VERDICTS must match
      # (the bench needs the CLI and poppler, so it lives in this job, not in pure-python).
      - name: Backend verdict equivalence
        run: python tests/backend_equiv.py "$RUNNER_TEMP/equiv"

      - name: Upload template PDFs and PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: templates-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/out/pdf
            ${{ runner.temp }}/out/log
          if-no-files-found: warn

  # No apt poppler, no Typst CLI: everything goes through typst-py and pypdfium2, the path a
  # user with `pip install` only gets. Fonts are the same as the full job, so fill targets hold.
  pure-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYPST_PY_VERSION: "0.15.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Python dependencies (no poppler, no typst CLI)
        run: pip install "typst==$TYPST_PY_VERSION" pypdfium2 Pillow pypdf

      - uses: ./.github/actions/fonts

      - name: Check every font the templates name is visible to typst-py
        run: |
          python - <<'PY'
          import sys, typst
          have = set(typst.Fonts(include_system_fonts=True).families())
          want = [l.strip() for l in open(".github/actions/fonts/families.txt") if l.strip()]
          missing = [f for f in want if f not in have]
          for f in missing: print("missing font:", f)
          sys.exit(1 if missing else 0)
          PY

      - name: Confirm no CLI tools are on PATH
        run: |
          for t in typst pdftotext pdfinfo pdftoppm; do ! command -v "$t" || { echo "$t is installed"; exit 1; }; done

      - name: Run all checks
        run: tests/run_all.sh "$RUNNER_TEMP/out"
