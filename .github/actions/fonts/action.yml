name: Fonts
description: >-
  The pinned upstream fonts the templates name (references/fonts.md), and fc-cache. Shared by
  every CI job so the two cannot drift. Pins live in tests/fetch_fonts.sh (also the cache key).
runs:
  using: composite
  steps:
    - name: Font pins
      shell: bash
      run: |
        key=$("$GITHUB_ACTION_PATH/../../../tests/fetch_fonts.sh" --key)
        [ -n "$key" ] || { echo "fetch_fonts.sh --key printed nothing" >&2; exit 1; }
        echo "FONTS_KEY=$key" >> "$GITHUB_ENV"

    - name: Restore fonts
      id: fonts-cache
      uses: actions/cache@v6
      with:
        path: ~/.local/share/fonts/vitae
        key: fonts-${{ env.FONTS_KEY }}

    - name: Fetch fonts
      if: steps.fonts-cache.outputs.cache-hit != 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../../../tests/fetch_fonts.sh" "$HOME/.local/share/fonts/vitae"'

    - name: Refresh the font cache
      shell: bash
      # Typst scans ~/.local/share/fonts itself; fontconfig is only refreshed when the runner has it.
      run: if command -v fc-cache >/dev/null; then fc-cache -f; fi
